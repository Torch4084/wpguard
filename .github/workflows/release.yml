name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, for example v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4
        with:
          # A manual dispatch builds the tag it was given, so that the
          # binaries always match the commit the tag points at.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross for the Linux targets
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cross

      - name: Verify the checkout matches the tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          actual="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n 1 "$tag" 2>/dev/null || echo '')"
          echo "tag   $tag -> ${tagged:-unknown}"
          echo "built $actual"
          if [ -n "$tagged" ] && [ "$tagged" != "$actual" ]; then
            echo "::error::the checked out commit does not match the tag, refusing to publish"
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#v}"
          binary="target/${{ matrix.target }}/release/wpguard"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            binary="${binary}.exe"
          fi
          name="wpguard-v${version}-${{ matrix.target }}"
          rm -rf "dist/${name}"
          mkdir -p "dist/${name}"
          cp "$binary" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            # The Windows runners have no zip binary, but they do have Python.
            if command -v python >/dev/null 2>&1; then
              python -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', root_dir=sys.argv[2], base_dir=sys.argv[3])" \
                "dist/${name}" "dist" "$name"
            else
              python3 -c "import shutil,sys; shutil.make_archive(sys.argv[1], 'zip', root_dir=sys.argv[2], base_dir=sys.argv[3])" \
                "dist/${name}" "dist" "$name"
            fi
          else
            tar -czf "dist/${name}.tar.gz" -C dist "$name"
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: wpguard-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          commitish: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*

[package]
name = "wpguard"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Static security analyzer for WordPress plugins and themes"
license = "MIT"
repository = "https://github.com/Torch4084/wpguard"
readme = "README.md"
keywords = ["wordpress", "security", "static-analysis", "php", "sast"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "wpguard"
path = "src/lib.rs"

[[bin]]
name = "wpguard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tree-sitter = "0.27"
tree-sitter-php = "0.25"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
